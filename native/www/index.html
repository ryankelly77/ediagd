<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>EDIAGD</title>
<!--
  OFFLINE FALLBACK ONLY.

  The shell serves the live app from server.url in capacitor.config.ts. This
  file is what Capacitor bundles as webDir, and a device only ever sees it when
  it cannot reach the network at all.

  It is deliberately one file with inline styles and no scripts: whatever is
  wrong when this renders, loading more things will not help.

  Tone matches the rest of the product — no red, no alarm, no blame. A service
  drive has bad signal sometimes; that is not the advisor's fault and the screen
  should not read like it is.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0C1C2C;
    color: #F4F0E4;
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: grid;
    place-items: center;
    padding: calc(env(safe-area-inset-top) + 2rem) 1.5rem
             calc(env(safe-area-inset-bottom) + 2rem);
    text-align: center;
  }
  .wrap { max-width: 22rem; }
  .mark { width: 88px; height: 88px; margin: 0 auto 1.5rem; display: block; }
  h1 { font-size: 1.25rem; font-weight: 800; margin: 0 0 .5rem; letter-spacing: -0.01em; }
  p { margin: 0; color: #D9ECEE; font-size: .95rem; }
  .hint { margin-top: 1.75rem; font-size: .8rem; color: #7EC8CD; }
</style>
</head>
<body>
  <div class="wrap">
    <!-- Inlined so the fallback needs no second request to render: this is the
         offline screen, and an <img> of the master would be one more thing that
         can fail to arrive. The geometry and the hexes below are COPIED VERBATIM
         from public/brand/svg/ediagd-mark-primary-dark.svg — the reverse master,
         because this screen's ground is navy. Do not restyle it here; if the
         mark changes, re-copy that file. -->
    <svg class="mark" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="56" fill="none" stroke="#f2efe8" stroke-width="2.4"/>
      <circle cx="52" cy="38" r="9" fill="#e3b15c"/>
      <g stroke="#e3b15c" stroke-width="2.2" stroke-linecap="round" fill="none">
        <line x1="52" y1="22" x2="52" y2="17"/>
        <line x1="41" y1="26" x2="38" y2="22.5"/>
        <line x1="63" y1="26" x2="66" y2="22.5"/>
        <line x1="36.5" y1="36" x2="31.5" y2="34.5"/>
        <line x1="67.5" y1="36" x2="72.5" y2="34.5"/>
      </g>
      <g fill="none" stroke="#f2efe8" stroke-width="2.4" stroke-linecap="round">
        <path d="M86 78 C 86 68, 84.5 56, 80 47"/>
        <path d="M80 47 C 72.5 42, 64 42.5, 58 47"/>
        <path d="M80 47 C 75 39.5, 67.5 36.5, 60 37.5"/>
        <path d="M80 47 C 82.5 38.5, 88 34, 95 33.5"/>
        <path d="M80 47 C 87.5 42.5, 95 43, 101 48"/>
        <path d="M80 47 C 79.5 39, 76 32.5, 70.5 29"/>
      </g>
      <path d="M16 76 C 22 52, 46 43, 57 55 C 48 52, 40.5 58, 42.5 67 C 53 60, 70 63, 80 73 C 60 82, 33 82, 16 76 Z" fill="#6fbcc6"/>
      <g fill="none" stroke="#6fbcc6" stroke-width="2.2" stroke-linecap="round">
        <path d="M26 88 C 42 93, 66 93.5, 86 88.5"/>
        <path d="M36 97 C 48 100.5, 64 100.5, 76 97.5" opacity="0.6"/>
      </g>
    </svg>
    <h1>No signal right now</h1>
    <p>Your numbers are safe. This screen comes back the moment you&rsquo;re connected again.</p>
    <p class="hint">Every Day Is A Great Day</p>
  </div>
</body>
</html>
