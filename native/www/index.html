<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>EDIAGD</title>
<!--
  OFFLINE FALLBACK ONLY.

  The shell serves the live app from server.url in capacitor.config.ts. This
  file is what Capacitor bundles as webDir, and a device only ever sees it when
  it cannot reach the network at all.

  It is deliberately one file with inline styles and no scripts: whatever is
  wrong when this renders, loading more things will not help.

  Tone matches the rest of the product — no red, no alarm, no blame. A service
  drive has bad signal sometimes; that is not the advisor's fault and the screen
  should not read like it is.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0C1C2C;
    color: #F4F0E4;
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: grid;
    place-items: center;
    padding: calc(env(safe-area-inset-top) + 2rem) 1.5rem
             calc(env(safe-area-inset-bottom) + 2rem);
    text-align: center;
  }
  .wrap { max-width: 22rem; }
  .mark { width: 88px; height: 88px; margin: 0 auto 1.5rem; display: block; }
  h1 { font-size: 1.25rem; font-weight: 800; margin: 0 0 .5rem; letter-spacing: -0.01em; }
  p { margin: 0; color: #D9ECEE; font-size: .95rem; }
  .hint { margin-top: 1.75rem; font-size: .8rem; color: #7EC8CD; }
</style>
</head>
<body>
  <div class="wrap">
    <!-- Inlined so the fallback needs no second request to render. -->
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="46" fill="none" stroke="#4AA8B0" stroke-width="3"/>
      <path d="M18 62c8 0 8-7 16-7s8 7 16 7 8-7 16-7 8 7 16 7"
            fill="none" stroke="#7EC8CD" stroke-width="4" stroke-linecap="round"/>
      <circle cx="50" cy="36" r="11" fill="#E8B44C"/>
    </svg>
    <h1>No signal right now</h1>
    <p>Your numbers are safe. This screen comes back the moment you&rsquo;re connected again.</p>
    <p class="hint">Every Day Is A Great Day</p>
  </div>
</body>
</html>
