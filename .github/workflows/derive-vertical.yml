# ============================================================================
# EDIAGD — derive the 9:16 renditions on a schedule
#
# WHY THIS EXISTS BEFORE THE BATCH, NOT AFTER. Every landscape master needs a
# vertical sibling cropped from it, and derive:vertical does one queue sweep and
# stops. Ingesting 56 videos without a scheduler means somebody sits at a
# terminal running the same command 56 times, spread over however long Mux takes
# to transcode each master — because a vertical cannot be derived until its
# master is ready.
#
# WHY GITHUB ACTIONS AND NOT A VERCEL CRON. The script shells out to ffmpeg and
# moves hundreds of megabytes through a temp directory. A Vercel function has no
# ffmpeg binary and a hard timeout; this runner has both a disk and an hour.
# That reasoning is already written down at the top of lib/mux/derive.ts — this
# workflow is that decision, scheduled.
#
# IT EXITS CLEAN WHEN IDLE. The script reads vertical_derivation_queue, prints
# "0 row(s) awaiting a vertical rendition", and returns. No rows means no work,
# not an error — so a quiet week is a column of green ticks rather than noise
# somebody learns to ignore.
# ============================================================================
name: derive-vertical

# ----------------------------------------------------------------------------
# PAUSED 8 OCTOBER 2026, RESUMED 21 NOVEMBER 2026 — and here is what settled it
# ----------------------------------------------------------------------------
# The pause was right, and it was held for two stated reasons. Both are now
# answered, so the reasons are kept rather than deleted: a schedule that was
# switched off for a documented cause should say what discharged the cause.
#
#   1  "Nobody yet knows why Mux declined to prepare a master inside 200 s on
#      8 October (account setting, asset age, or time)."
#
#      Answered by running it. On 21 November the whole backlog of 22 rows was
#      drained BY HAND with this same script, one film first and then the rest,
#      and not one of them hit the 200 s wait. The failure did not reproduce on
#      a single asset. It is still not explained, but it is no longer a reason
#      to withhold the schedule: the script's own refusal path handles it — a
#      master that never arrives raises `no master within 200 s`, the row is
#      recorded refused, and the exit code is non-zero. The HLS fallback that
#      made that case dangerous was removed long ago.
#
#   2  "It would also be a writer racing a reader: the 447-film verification
#      measures which rendition a phone gets."
#
#      That verification finished in October. There is no reader to race.
#
# ----------------------------------------------------------------------------
# AND THE REASON IT CANNOT STAY PAUSED
# ----------------------------------------------------------------------------
# `replace_master_asset()` marks a vertical `stale` in the same statement that
# swaps a master — correctly, because the old crop predates the new take. A
# stale vertical mints no token, so lib/video-rendition.ts receives
# `vertical: null` and serves the master letterboxed. That is the designed
# fallback and it is fine for an hour.
#
# With the worker off it is permanent. Between 8 October and 20 November, 22
# films had their masters swapped — by the trim close-out, the sync repair,
# #87/#89 and the 30 October ingest — and every one of them served the
# landscape cut to every phone from that day forward, with nothing anywhere
# raising a word about it. It was found by somebody watching a film and saying
# it looked wrong.
#
# The pause removed the automatic claim and left `workflow_dispatch` in place,
# so the repair was always one click away — and in six weeks nobody clicked,
# because nothing told them to. A queue with no drainer is not a queue.
on:
  schedule:
    # Every 30 minutes. Mux takes a few minutes per 4K master, so this picks up
    # a batch in waves rather than all at once — which is what we want, since
    # each derivation downloads a master and re-encodes it.
    - cron: "*/30 * * * *"
  # So a batch can be pushed along by hand without waiting for the next tick.
  workflow_dispatch:

# ONE AT A TIME. A sweep of 56 masters can outlast the 30-minute tick, and two
# concurrent runs would both claim the same queue rows and encode them twice.
# `cancel-in-progress: false` because killing a run mid-encode would leave the
# row marked pending with a half-uploaded rendition — better to skip a tick.
concurrency:
  group: derive-vertical
  cancel-in-progress: false

jobs:
  derive:
    runs-on: ubuntu-latest
    # Generous, not unlimited: a stuck ffmpeg should fail the run rather than
    # burn an hour of runner time on every tick.
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # ffmpeg is the whole job. ubuntu-latest ships it, but pinning the install
      # means a runner image change cannot silently remove it.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - run: npm ci

      - name: Derive pending verticals
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_KEY: ${{ secrets.SB_KEY }}
          MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
          MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET }}
          MUX_SIGNING_KEY_ID: ${{ secrets.MUX_SIGNING_KEY_ID }}
          MUX_SIGNING_KEY_PRIVATE: ${{ secrets.MUX_SIGNING_KEY_PRIVATE }}
        run: npm run derive:vertical
